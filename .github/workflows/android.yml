name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build tools
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;34.0.0' 'build-tools;36.0.0'
      - name: Fetch the pinned Android engine
        run: |
          expected=$(cut -d ' ' -f1 engine.sha256)
          ./update-engine.sh 1.75.2
          printf '%s  %s\n' "$expected" lib/arm64-v8a/librclone.so | shasum -a 256 -c -
      - name: Compile and verify the APK
        run: ./build.sh
